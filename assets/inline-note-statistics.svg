<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Inline statistics strip using anonymized real data</title><desc id="desc">Real local statistics for one note, with the note name replaced by Note A.</desc>
  <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#8b7cf6"/><stop offset="1" stop-color="#59c3ff"/></linearGradient><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#24263b}.muted{fill:#737b98}.label{font-size:14px}.value{font-size:19px;font-weight:700}.note{font-size:26px;font-weight:700}.body{font-size:15px}</style></defs>
  <rect width="1200" height="300" rx="20" fill="#f6f7fc"/><rect x="28" y="24" width="1144" height="108" rx="15" fill="#fff" stroke="#dfe2f1"/><rect x="28" y="24" width="7" height="108" rx="3.5" fill="url(#g)"/>
  <g transform="translate(58 49)"><g><text class="label muted" y="16">OPENED</text><text class="value" y="48">2 times</text></g><g transform="translate(145)"><text class="label muted" y="16">TOTAL</text><text class="value" y="48">2m 15s</text></g><g transform="translate(292)"><text class="label muted" y="16">AVERAGE</text><text class="value" y="48">1m 08s</text></g><g transform="translate(447)"><text class="label muted" y="16">LONGEST</text><text class="value" y="48">1m 37s</text></g><g transform="translate(602)"><text class="label muted" y="16">ACTIVE DAYS</text><text class="value" y="48">1 day</text></g><g transform="translate(760)"><text class="label muted" y="16">CURRENT STREAK</text><text class="value" y="48">1 day</text></g><g transform="translate(945)"><text class="label muted" y="16">LAST READ</text><text class="value" y="48">Today</text></g></g>
  <text x="42" y="180" class="note">Note A · name redacted</text><rect x="42" y="198" width="680" height="8" rx="4" fill="#dfe2f1"/><rect x="42" y="220" width="1080" height="7" rx="3.5" fill="#e7e9f3"/><rect x="42" y="242" width="920" height="7" rx="3.5" fill="#e7e9f3"/><text x="714" y="282" class="body muted">Real local values · title anonymized · Markdown unchanged</text>
</svg>
