<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Study Time Statistics dashboard</title>
  <desc id="desc">A privacy-safe mock dashboard containing synthetic example data.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#15182a"/><stop offset="1" stop-color="#0c1020"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#8b7cf6"/><stop offset="1" stop-color="#59c3ff"/></linearGradient>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#eef0ff}.muted{fill:#9ba4c7}.card{fill:#1e233a;stroke:#323957}.small{font-size:14px}.label{font-size:15px}.value{font-size:26px;font-weight:700}.h{font-size:23px;font-weight:700}.bar{fill:#7668e8}.cell{fill:#343a5b}.l1{fill:#484585}.l2{fill:#6459b7}.l3{fill:#8070e8}.l4{fill:#59c3ff}
    </style>
  </defs>
  <rect width="1200" height="720" rx="22" fill="url(#bg)"/>
  <rect x="28" y="28" width="1144" height="60" rx="14" fill="#1b2035"/>
  <circle cx="58" cy="58" r="14" fill="url(#accent)"/><text x="84" y="66" class="h">Study Time Statistics</text>
  <rect x="930" y="43" width="214" height="30" rx="15" fill="#292f4a"/><text x="956" y="64" class="small muted">SYNTHETIC EXAMPLE DATA</text>
  <g>
    <rect class="card" x="28" y="108" width="210" height="102" rx="14"/><text x="48" y="139" class="label muted">Today</text><text x="48" y="179" class="value">1h 42m</text>
    <rect class="card" x="252" y="108" width="210" height="102" rx="14"/><text x="272" y="139" class="label muted">Total sessions</text><text x="272" y="179" class="value">86</text>
    <rect class="card" x="476" y="108" width="210" height="102" rx="14"/><text x="496" y="139" class="label muted">Average visit</text><text x="496" y="179" class="value">12m 18s</text>
    <rect class="card" x="700" y="108" width="210" height="102" rx="14"/><text x="720" y="139" class="label muted">Current streak</text><text x="720" y="179" class="value">9 days</text>
    <rect class="card" x="924" y="108" width="248" height="102" rx="14"/><text x="944" y="139" class="label muted">Notes studied</text><text x="944" y="179" class="value">24</text>
  </g>
  <rect class="card" x="28" y="228" width="724" height="210" rx="14"/><text x="50" y="263" class="h">365-day study heatmap</text><text x="50" y="288" class="small muted">Local activity only · 57 active days</text>
  <g transform="translate(52 312)">
    <g id="week"><rect class="cell" x="0" y="0" width="13" height="13" rx="3"/><rect class="l1" x="0" y="18" width="13" height="13" rx="3"/><rect class="cell" x="0" y="36" width="13" height="13" rx="3"/><rect class="l3" x="0" y="54" width="13" height="13" rx="3"/><rect class="l2" x="0" y="72" width="13" height="13" rx="3"/><rect class="cell" x="0" y="90" width="13" height="13" rx="3"/><rect class="l4" x="0" y="108" width="13" height="13" rx="3"/></g>
    <use href="#week" x="18"/><use href="#week" x="36"/><use href="#week" x="54"/><use href="#week" x="72"/><use href="#week" x="90"/><use href="#week" x="108"/><use href="#week" x="126"/><use href="#week" x="144"/><use href="#week" x="162"/><use href="#week" x="180"/><use href="#week" x="198"/><use href="#week" x="216"/><use href="#week" x="234"/><use href="#week" x="252"/><use href="#week" x="270"/><use href="#week" x="288"/><use href="#week" x="306"/><use href="#week" x="324"/><use href="#week" x="342"/><use href="#week" x="360"/><use href="#week" x="378"/><use href="#week" x="396"/><use href="#week" x="414"/><use href="#week" x="432"/><use href="#week" x="450"/><use href="#week" x="468"/><use href="#week" x="486"/><use href="#week" x="504"/><use href="#week" x="522"/><use href="#week" x="540"/><use href="#week" x="558"/><use href="#week" x="576"/><use href="#week" x="594"/><use href="#week" x="612"/><use href="#week" x="630"/><use href="#week" x="648"/>
  </g>
  <rect class="card" x="770" y="228" width="402" height="464" rx="14"/><text x="792" y="264" class="h">Longest total reading</text><text x="792" y="289" class="small muted">Click a row to open the note</text>
  <g class="label"><text x="796" y="335">1</text><text x="826" y="335">Statistics Basics</text><text x="1086" y="335">2h 18m</text><rect x="826" y="348" width="314" height="6" rx="3" fill="#323957"/><rect x="826" y="348" width="292" height="6" rx="3" fill="url(#accent)"/>
    <text x="796" y="395">2</text><text x="826" y="395">Research Methods</text><text x="1086" y="395">1h 44m</text><rect x="826" y="408" width="314" height="6" rx="3" fill="#323957"/><rect class="bar" x="826" y="408" width="220" height="6" rx="3"/>
    <text x="796" y="455">3</text><text x="826" y="455">Academic Writing</text><text x="1086" y="455">1h 12m</text><rect x="826" y="468" width="314" height="6" rx="3" fill="#323957"/><rect class="bar" x="826" y="468" width="152" height="6" rx="3"/>
  </g>
  <rect class="card" x="28" y="456" width="350" height="236" rx="14"/><text x="50" y="491" class="h">30-day trend</text>
  <g transform="translate(54 522)"><rect class="bar" x="0" y="80" width="15" height="52" rx="4"/><rect class="bar" x="24" y="60" width="15" height="72" rx="4"/><rect class="bar" x="48" y="98" width="15" height="34" rx="4"/><rect class="bar" x="72" y="42" width="15" height="90" rx="4"/><rect class="bar" x="96" y="69" width="15" height="63" rx="4"/><rect class="l4" x="120" y="20" width="15" height="112" rx="4"/><rect class="bar" x="144" y="52" width="15" height="80" rx="4"/><rect class="bar" x="168" y="88" width="15" height="44" rx="4"/><rect class="l4" x="192" y="35" width="15" height="97" rx="4"/><rect class="bar" x="216" y="74" width="15" height="58" rx="4"/><rect class="bar" x="240" y="49" width="15" height="83" rx="4"/><rect class="l4" x="264" y="11" width="15" height="121" rx="4"/></g>
  <rect class="card" x="396" y="456" width="356" height="236" rx="14"/><text x="418" y="491" class="h">Study rhythm</text><text x="418" y="521" class="small muted">Most active: 20:00–22:00</text>
  <path d="M420 641 C455 630 470 612 502 618 S548 590 580 602 S625 548 658 570 S702 520 730 538" fill="none" stroke="url(#accent)" stroke-width="8" stroke-linecap="round"/><line x1="420" y1="657" x2="730" y2="657" stroke="#323957" stroke-width="2"/>
</svg>
