<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Study Time Statistics dashboard using anonymized real data</title>
  <desc id="desc">A privacy-safe dashboard generated from a real local statistics snapshot captured on 2026-08-10. Note names are replaced with Note A and Note B.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#15182a"/><stop offset="1" stop-color="#0c1020"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#8b7cf6"/><stop offset="1" stop-color="#59c3ff"/></linearGradient>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#eef0ff}.muted{fill:#9ba4c7}.card{fill:#1e233a;stroke:#323957}.small{font-size:14px}.label{font-size:15px}.value{font-size:26px;font-weight:700}.h{font-size:23px;font-weight:700}.bar{fill:#7668e8}.cell{fill:#343a5b}.hot{fill:#59c3ff}
    </style>
    <g id="empty-week">
      <rect class="cell" x="0" y="0" width="10" height="10" rx="2"/><rect class="cell" x="0" y="15" width="10" height="10" rx="2"/><rect class="cell" x="0" y="30" width="10" height="10" rx="2"/><rect class="cell" x="0" y="45" width="10" height="10" rx="2"/><rect class="cell" x="0" y="60" width="10" height="10" rx="2"/><rect class="cell" x="0" y="75" width="10" height="10" rx="2"/><rect class="cell" x="0" y="90" width="10" height="10" rx="2"/>
    </g>
  </defs>
  <rect width="1200" height="720" rx="22" fill="url(#bg)"/>
  <rect x="28" y="28" width="1144" height="60" rx="14" fill="#1b2035"/>
  <circle cx="58" cy="58" r="14" fill="url(#accent)"/><text x="84" y="66" class="h">Study Time Statistics</text>
  <rect x="873" y="43" width="271" height="30" rx="15" fill="#292f4a"/><text x="895" y="64" class="small muted">REAL DATA · NOTE NAMES REDACTED</text>
  <g>
    <rect class="card" x="28" y="108" width="210" height="102" rx="14"/><text x="48" y="139" class="label muted">Today</text><text x="48" y="179" class="value">2m 44s</text>
    <rect class="card" x="252" y="108" width="210" height="102" rx="14"/><text x="272" y="139" class="label muted">Recorded opens</text><text x="272" y="179" class="value">4</text>
    <rect class="card" x="476" y="108" width="210" height="102" rx="14"/><text x="496" y="139" class="label muted">Average per open</text><text x="496" y="179" class="value">41s</text>
    <rect class="card" x="700" y="108" width="210" height="102" rx="14"/><text x="720" y="139" class="label muted">Current streak</text><text x="720" y="179" class="value">1 day</text>
    <rect class="card" x="924" y="108" width="248" height="102" rx="14"/><text x="944" y="139" class="label muted">Notes studied</text><text x="944" y="179" class="value">2</text>
  </g>
  <rect class="card" x="28" y="228" width="724" height="210" rx="14"/><text x="50" y="263" class="h">365-day study heatmap</text><text x="50" y="288" class="small muted">Real local snapshot · 1 active day</text>
  <g transform="translate(52 312)">
    <use href="#empty-week" x="0"/><use href="#empty-week" x="13"/><use href="#empty-week" x="26"/><use href="#empty-week" x="39"/><use href="#empty-week" x="52"/><use href="#empty-week" x="65"/><use href="#empty-week" x="78"/><use href="#empty-week" x="91"/><use href="#empty-week" x="104"/><use href="#empty-week" x="117"/><use href="#empty-week" x="130"/><use href="#empty-week" x="143"/><use href="#empty-week" x="156"/><use href="#empty-week" x="169"/><use href="#empty-week" x="182"/><use href="#empty-week" x="195"/><use href="#empty-week" x="208"/><use href="#empty-week" x="221"/><use href="#empty-week" x="234"/><use href="#empty-week" x="247"/><use href="#empty-week" x="260"/><use href="#empty-week" x="273"/><use href="#empty-week" x="286"/><use href="#empty-week" x="299"/><use href="#empty-week" x="312"/><use href="#empty-week" x="325"/><use href="#empty-week" x="338"/><use href="#empty-week" x="351"/><use href="#empty-week" x="364"/><use href="#empty-week" x="377"/><use href="#empty-week" x="390"/><use href="#empty-week" x="403"/><use href="#empty-week" x="416"/><use href="#empty-week" x="429"/><use href="#empty-week" x="442"/><use href="#empty-week" x="455"/><use href="#empty-week" x="468"/><use href="#empty-week" x="481"/><use href="#empty-week" x="494"/><use href="#empty-week" x="507"/><use href="#empty-week" x="520"/><use href="#empty-week" x="533"/><use href="#empty-week" x="546"/><use href="#empty-week" x="559"/><use href="#empty-week" x="572"/><use href="#empty-week" x="585"/><use href="#empty-week" x="598"/><use href="#empty-week" x="611"/><use href="#empty-week" x="624"/><use href="#empty-week" x="637"/><use href="#empty-week" x="650"/><use href="#empty-week" x="663"/>
    <rect class="hot" x="663" y="90" width="10" height="10" rx="2"/>
  </g>
  <text x="52" y="425" class="small muted">Aug 2025</text><text x="671" y="425" class="small muted">Aug 2026</text>
  <rect class="card" x="770" y="228" width="402" height="464" rx="14"/><text x="792" y="264" class="h">Longest total reading</text><text x="792" y="289" class="small muted">Real values · titles anonymized</text>
  <g class="label">
    <text x="796" y="335">1</text><text x="826" y="335">Note A</text><text x="1086" y="335">2m 15s</text><rect x="826" y="348" width="314" height="6" rx="3" fill="#323957"/><rect x="826" y="348" width="314" height="6" rx="3" fill="url(#accent)"/>
    <text x="796" y="395">2</text><text x="826" y="395">Note B</text><text x="1086" y="395">29s</text><rect x="826" y="408" width="314" height="6" rx="3" fill="#323957"/><rect class="bar" x="826" y="408" width="68" height="6" rx="3"/>
  </g>
  <text x="792" y="468" class="small muted">Captured: 2026-08-10</text><text x="792" y="494" class="small muted">No note titles, paths, folders,</text><text x="792" y="516" class="small muted">or note contents are included.</text>
  <rect class="card" x="28" y="456" width="350" height="236" rx="14"/><text x="50" y="491" class="h">30-day trend</text><text x="50" y="518" class="small muted">One recorded active day</text>
  <line x1="54" y1="655" x2="352" y2="655" stroke="#323957" stroke-width="2"/><rect class="hot" x="326" y="536" width="18" height="119" rx="5"/><text x="308" y="678" class="small muted">Aug 10</text>
  <rect class="card" x="396" y="456" width="356" height="236" rx="14"/><text x="418" y="491" class="h">Study rhythm</text><text x="418" y="521" class="small muted">Most active hour: 01:00 · 2 sessions</text>
  <line x1="424" y1="655" x2="725" y2="655" stroke="#323957" stroke-width="2"/><rect x="444" y="625" width="34" height="30" rx="6" fill="#343a5b"/><rect x="512" y="545" width="34" height="110" rx="6" fill="url(#accent)"/><rect x="580" y="625" width="34" height="30" rx="6" fill="#343a5b"/><rect x="648" y="625" width="34" height="30" rx="6" fill="#343a5b"/><text x="449" y="680" class="small muted">00</text><text x="517" y="680" class="small muted">01</text><text x="585" y="680" class="small muted">02</text><text x="653" y="680" class="small muted">03</text>
</svg>
