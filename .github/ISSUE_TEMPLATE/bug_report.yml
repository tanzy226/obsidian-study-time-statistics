name: Bug report
description: Report a reproducible problem without exposing private vault content
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Please replace private note titles and paths with anonymous examples.
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Obsidian version, plugin version, and operating system
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
