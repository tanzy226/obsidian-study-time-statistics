name: Bug report / 错误报告
description: Report a reproducible problem without exposing private vault content / 报告可复现问题，不暴露私密库内容
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Please replace private note titles and paths with anonymous examples. / 请用匿名示例替换私人笔记标题和路径。
  - type: input
    id: versions
    attributes:
      label: Versions / 版本信息
      description: Obsidian version, plugin version, operating system, and desktop or mobile / Obsidian 版本、插件版本、操作系统及桌面端或移动端
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps / 复现步骤
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior / 预期行为
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior / 实际行为
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check / 隐私确认
      options:
        - label: I removed private note names, paths, content, and identifying timestamps. / 我已删除私人笔记名、路径、正文及可识别时间。
          required: true
