name: Release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm audit
      - name: Verify tag matches manifest
        run: node -e "const m=require('./manifest.json'); if (process.env.GITHUB_REF_NAME !== m.version) process.exit(1)"
      - name: Verify tag belongs to main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Verify bilingual release notes exist
        run: test -s ".github/release-notes/$GITHUB_REF_NAME.md"
      - name: Attest release assets
        uses: actions/attest@v4
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          main.js manifest.json styles.css
          --title "Study Time Statistics $GITHUB_REF_NAME"
          --notes-file ".github/release-notes/$GITHUB_REF_NAME.md"
